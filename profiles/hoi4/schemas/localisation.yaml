resource_type: localisation
label: "HOI4ローカライズ"
collection: "localisation"
editor: table

fields:
  - name: id
    label: "キー"
    type: string
    required: true

  - name: language
    label: "言語"
    type: enum
    options:
      - japanese
      - english
      - french
      - german
      - spanish
      - russian
      - polish
      - portuguese

  - name: text
    label: "本文"
    type: text

  - name: version
    label: "バージョン"
    type: number
